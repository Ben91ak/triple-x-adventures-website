  <link rel="preload" href="/videos/TXA Teaser 2025 Homepage.mp4" as="video" type="video/mp4" fetchpriority="high" crossorigin>
  
  <!-- Critical fonts loaded directly for better performance -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Load non-critical CSS asynchronously -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
  
  <!-- Inline critical CSS -->
  <style>
    /* Critical CSS for above-the-fold content */
    :root {
      --midnight: #0F2D40;
      --ice: #F8FBFF;
      --fire: #E05E2B;
      --forest: #2C5545;

    body {
      margin: 0;

      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Reduce CLS (Cumulative Layout Shift) for images */
    img {
      max-width: 100%;
      height: auto;
      display: block; /* Prevents bottom margin space */
    }
    
    /* Heading font */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      margin-top: 0;
    }
    
    /* Hero section skeleton */
    .hero-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }
  </style>
  
  <title>Triple X Adventures - The Real Arctic Deal</title>
</head>
<body>
  <!-- Application root with proper HTML5 semantics -->
  <main id="root"></main>
  
  <!-- Application scripts -->
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Cleanup script for preloads and service worker registration with proper error handling -->
  <script>
    // Wait for DOM to be loaded to clean up any potential preload issues
    document.addEventListener('DOMContentLoaded', function() {
      // Remove any dynamically added preload links that might cause warnings
      function cleanupUnusedPreloads() {
        const preloads = document.head.querySelectorAll('link[rel="preload"]');
        const validAsValues = ['script', 'style', 'image', 'font', 'video', 'audio', 'document', 'embed', 'fetch', 'object', 'track', 'worker'];

        preloads.forEach(link => {
          const asValue = link.getAttribute('as');
          const hrefValue = link.getAttribute('href');

          // 1. If 'as' attribute is present but its value is not in the valid set (this matches the warning)
          if (asValue && !validAsValues.includes(asValue.toLowerCase())) {
            console.warn(`Removing preload with unsupported 'as' value ('${asValue}') for href '${hrefValue}':`, link.outerHTML);
            link.remove();
            return; // Link removed, go to next
          }

          // 2. If 'as' attribute is MISSING, and it's for a JS file (common error for rel="preload")
          // The warning "unsupported 'as' value" implies 'as' is present but invalid,
          // but this check is good practice for script preloads.
          if (!asValue && hrefValue && (hrefValue.endsWith('.js') || hrefValue.includes('/assets/js/'))) {
            console.warn(`Found JS preload with missing 'as' attribute for href '${hrefValue}'. Consider adding as="script" or using modulepreload. Removing for now:`, link.outerHTML);
            link.remove();
            return; // Link removed, go to next
          }

          // 3. Original broad cleanup logic - temporarily commented out.
          // This was removing valid preloads for images/other videos added by your optimization utilities.
          // If, after fixing the specific warning, other preload issues arise, this can be revisited.
          /*
          if (hrefValue && !hrefValue.includes('TXA Teaser 2025 Homepage.mp4')) {
            // This check is too broad as it removes legitimate preloads.
            // console.log('Original broad cleanup: Removing preload not matching main video:', link.outerHTML);
            // link.remove();
          }
          */
        });
      }
      
      // Run cleanup after a short delay to catch any dynamically added preloads
      setTimeout(cleanupUnusedPreloads, 100);
      
      // Run again after full page load
      window.addEventListener('load', function() {
        setTimeout(cleanupUnusedPreloads, 100);
      });
    });
    
    // Check if service worker is supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          // First, check if the service worker is available
          const response = await fetch('/service-worker.js');
          if (!response.ok) {
            throw new Error(`Service worker file not found: ${response.status}`);
          }
          
          // If available, register it
          const registration = await navigator.serviceWorker.register('/service-worker.js');
          console.log('Service worker registered:', registration.scope);
        } catch (error) {
          console.error('Service worker registration failed:', error);
          // Don't block the app if service worker fails - graceful degradation
        }
      });
    }
  </script>
</body>
</html>
